# FMC-Wave RT-DETR-OBB-L: scene-conditioned evidence-calibrated SC-v2.
task: obb
nc: 9

obb_loss:
  class: 1.0
  bbox: 5.0
  angle: 0.75
  gwd: 2.0
  riou: 0.75
  corner: 0.25
  angle_min_weight: 0.25
  weighted_match_angle: true
  oriented_mask: true
  gwd_tau: 0.05
  lambda_mask: 0.5
  aux_loss: true
  use_fl: true
  use_vfl: true

freq_guidance:
  mask_source: wavelet
  semantic_mode: residual_logit
  query_mode: frequency_global_topk
  fixed_quotas: [500, 300, 200]
  acsa_freq_enabled: true
  enabled: true
  semantic_calibration:
    enabled: true
    mode: residual_logit
    alpha_init: [0.00, 0.00]
    alpha_max: [0.75, 0.75]
    detach_semantic_anchor: true
  query:
    mode: frequency_global_topk
    num_queries: 1000
    level_betas: [0.25, 0.50, 0.75]
    centered_mask: true
    boost_min: 0.50
    boost_max: 1.50
    peak_kernel: 3
    non_peak_weight: 0.60
    min_quotas: [100, 80, 60]
    max_quotas: [650, 550, 450]
    fallback_quotas: [500, 300, 200]
    prior: [0.45, 0.32, 0.23]
    evidence_topr: 256
    evidence_eps: 1.0e-4
    evidence_weights: [1.00, 0.50, 0.75, 0.50]
    active_threshold_std: 0.50
    capacity_multiplier: 2.00
    dynamic_ratio_start: 0.20
    dynamic_ratio_mid: 0.50
    dynamic_ratio_final: 0.80
    dynamic_ratio_mid_epoch: 10
    dynamic_ratio_final_epoch: 30
    temperature_start: 1.00
    temperature_final: 0.50
    temperature_final_epoch: 30
  acsa_betas: [0.50, 0.80, 1.00]
  mask_loss:
    use_calibrated_masks: true
    scale_weights: [0.80, 1.00, 1.00]
  diagnostics:
    enabled: true
    store_last_batch: false
    fallback_to_global_topk: true
    strict_train_masks: true

scales:
  l: [1.00, 1.00, 2048]

backbone:
  - [-1, 1, ESSamp_v2, [96]]
  - [-1, 1, ESSamp_v2, [192]]
  - [-1, 1, HSG_WAVE_With_Mask, [256, 0.75, 0, 32]]
  - [-1, 1, ESSamp_v2, [384]]
  - [-1, 1, HSG_WAVE_With_Mask, [512, 0.75, 1, 32]]
  - [-1, 1, ESSamp_v2, [768]]
  - [-1, 1, SPPF, [384, 5]]
  - [-1, 1, HSG_WAVE_With_Mask, [768, 0.75, 2, 32]]

head:
  - [7, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, ACSA_FG, [384, 0.5, true, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, ACSA_FG, [192, 0.7, true, 0]]
  - [13, 1, ESSamp_v2, [384]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, ACSA_FG, [384, 0.5, true, 1]]
  - [16, 1, ESSamp_v2, [768]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, ACSA_FG, [768, 0.5, true, 2]]
  - [13, 1, nn.Identity, []]
  - [16, 1, nn.Identity, []]
  - [19, 1, nn.Identity, []]
  - [[20, 21, 22], 1, WaveRTDETRDecoderOBB, [nc, 384, 1000]]
